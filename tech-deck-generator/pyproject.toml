[project]
name = "tech-deck-generator"
version = "0.1.0"
description = "AI tool for domain experts to make technical lecture decks"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
